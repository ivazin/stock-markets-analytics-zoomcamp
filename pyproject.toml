[project]
name = "stock-markets-analytics-zoomcamp"
version = "0.1.0"
description = "Stock Markets Analytics Zoomcamp"
readme = "README.md"
authors = [
    { name = "User" }
]
requires-python = ">=3.12"
dependencies = [
    "apimoex>=1.4.0",
    "beautifulsoup4>=4.12.0",
    "gdown>=6.4.0",
    "html5lib>=1.1",
    "lxml>=5.0.0",
    "matplotlib>=3.10.0",
    "pandas>=2.2.0",
    "pyarrow>=25.0.1",
    "requests>=2.31.0",
    "scipy>=1.18.1",
    "tqdm>=4.66.0",
    "yfinance>=0.2.40",
]

[project.scripts]
stock-markets-analytics-zoomcamp = "stock_markets_analytics_zoomcamp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
